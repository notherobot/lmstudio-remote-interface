<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .tower-bg { fill: #1b3245; }
        .tower-fill { fill: #7ecbf5; }
        .tower-accent { fill: #a3ddff; }
      }
      @media (prefers-color-scheme: light) {
        .tower-bg { fill: #e6f2fa; }
        .tower-fill { fill: #2c5872; }
        .tower-accent { fill: #1b3245; }
      }
    </style>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" class="tower-bg"/>
  <!-- Tower spires -->
  <rect x="6" y="8" width="2" height="16" class="tower-fill"/>
  <rect x="15" y="6" width="2" height="18" class="tower-accent"/>
  <rect x="24" y="8" width="2" height="16" class="tower-fill"/>
</svg>